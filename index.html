<script>
(() => {
  "use strict";

const $ = (selector, root = document) =>
    root.querySelector(selector);

const $$ = (selector, root = document) =>
    [...root.querySelectorAll(selector)];

const motionQuery = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  );

const pointerQuery = window.matchMedia(
    "(hover: hover) and (pointer: fine)"
  );

const clamp = (value, min, max) =>
    Math.min(max, Math.max(min, value));

/*
   * Isolate features so an optional enhancement failing
   * does not disable navigation or the contact form.
   */
  function initialize(name, setup) {
    try {
      setup();
    } catch (error) {
      console.error(`${name} could not initialize:`, error);
    }
  }

/* ==========================================
     REVEAL ANIMATIONS
     ========================================== */

initialize("Reveal animations", () => {
    const elements = $$(".reveal");

if (
      motionQuery.matches ||
      !("IntersectionObserver" in window)
    ) {
      elements.forEach(element => element.classList.add("in"));
      return;
    }

const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;

entry.target.classList.add("in");
        observer.unobserve(entry.target);
      });
    }, {
      threshold: 0.08
    });

elements.forEach(element => observer.observe(element));

document.documentElement.classList.add("motion-enabled");

motionQuery.addEventListener("change", event => {
      if (!event.matches) return;

observer.disconnect();
      document.documentElement.classList.remove("motion-enabled");
      elements.forEach(element => element.classList.add("in"));
    });
  });

/* ==========================================
     PERSPECTIVE PARTICLE BACKGROUND

Actual x/y/z projection onto a 2D canvas.
     Motion is time-based rather than frame-based.
     ========================================== */

initialize("Particle background", () => {
    const canvas = $("#bgCanvas");
    if (!canvas) return;

const context = canvas.getContext("2d");
    if (!context) return;

canvas.setAttribute("aria-hidden", "true");

const colors = [
      "10,132,255",
      "0,200,150",
      "56,189,248",
      "255,176,32"
    ];

let width = 0;
    let height = 0;
    let particles = [];
    let frame = 0;
    let previousTime = 0;
    let elapsed = 0;

const pointer = { x: 0, y: 0 };
    const camera = { x: 0, y: 0 };

function resize() {
      width = window.innerWidth;
      height = window.innerHeight;

const ratio = Math.min(window.devicePixelRatio || 1, 2);

canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;

context.setTransform(ratio, 0, 0, ratio, 0, 0);

const count = width < 700 ? 42 : 78;

particles = Array.from({ length: count }, () => ({
        x: (Math.random() - 0.5) * width * 2.8,
        y: (Math.random() - 0.5) * height * 2.8,
        z: 100 + Math.random() * 1300,
        radius: 0.8 + Math.random() * 1.9,
        speed: 14 + Math.random() * 22,
        color: colors[Math.floor(Math.random() * colors.length)]
      }));

if (!frame) render(0);
    }

function glow(x, y, radius, color, opacity) {
      const gradient = context.createRadialGradient(
        x, y, 0, x, y, radius
      );

gradient.addColorStop(0, `rgba(${color},${opacity})`);
      gradient.addColorStop(0.5, `rgba(${color},${opacity * 0.32})`);
      gradient.addColorStop(1, `rgba(${color},0)`);

context.fillStyle = gradient;
      context.fillRect(x - radius, y - radius, radius * 2, radius * 2);
    }

function render(delta) {
      elapsed += delta;

const smoothing = 1 - Math.exp(-4 * delta);

camera.x += (pointer.x - camera.x) * smoothing;
      camera.y += (pointer.y - camera.y) * smoothing;

context.clearRect(0, 0, width, height);
      context.fillStyle = "#05060f";
      context.fillRect(0, 0, width, height);

const drift = Math.sin(elapsed * 0.18) * 45;

glow(
        width * 0.16 + drift,
        height * 0.2,
        Math.min(width * 0.6, 580),
        "10,132,255",
        0.15
      );

glow(
        width * 0.82 - drift,
        height * 0.52,
        Math.min(width * 0.6, 540),
        "0,200,150",
        0.1
      );

glow(
        width * 0.45,
        height * 0.95,
        390,
        "255,176,32",
        0.045
      );

const focalLength = 650;

const projected = particles.map(particle => {
        particle.z -= particle.speed * delta;

if (particle.z < 80) {
          particle.z = 1400;
          particle.x = (Math.random() - 0.5) * width * 2.8;
          particle.y = (Math.random() - 0.5) * height * 2.8;
        }

const scale = focalLength / (focalLength + particle.z);

return {
          x: width / 2 + (particle.x - camera.x * 95) * scale,
          y: height / 2 + (particle.y - camera.y * 70) * scale,
          radius: particle.radius * scale,
          alpha: clamp(1 - particle.z / 1600, 0.12, 0.8),
          color: particle.color,
          z: particle.z
        };
      });

const connectionDistance = width < 700 ? 90 : 125;

context.lineWidth = 0.6;

for (let i = 0; i < projected.length; i++) {
        for (let j = i + 1; j < projected.length; j++) {
          const a = projected[i];
          const b = projected[j];

if (Math.abs(a.z - b.z) > 320) continue;

const distance = Math.hypot(a.x - b.x, a.y - b.y);
          if (distance >= connectionDistance) continue;

const alpha = (1 - distance / connectionDistance) * 0.14;

context.strokeStyle = `rgba(56,189,248,${alpha})`;
          context.beginPath();
          context.moveTo(a.x, a.y);
          context.lineTo(b.x, b.y);
          context.stroke();
        }
      }

projected
        .sort((a, b) => b.z - a.z)
        .forEach(particle => {
          context.fillStyle =
            `rgba(${particle.color},${particle.alpha})`;

context.beginPath();
          context.arc(
            particle.x,
            particle.y,
            particle.radius,
            0,
            Math.PI * 2
          );
          context.fill();
        });
    }

function animate(time) {
      const delta = previousTime
        ? Math.min((time - previousTime) / 1000, 0.05)
        : 0;

previousTime = time;
      render(delta);
      frame = requestAnimationFrame(animate);
    }

function synchronizeAnimation() {
      cancelAnimationFrame(frame);
      frame = 0;
      previousTime = 0;

if (document.hidden) return;

if (motionQuery.matches) {
        pointer.x = pointer.y = 0;
        camera.x = camera.y = 0;
        render(0);
        return;
      }

frame = requestAnimationFrame(animate);
    }

window.addEventListener("pointermove", event => {
      if (!pointerQuery.matches || motionQuery.matches) return;

pointer.x = event.clientX / Math.max(width, 1) * 2 - 1;
      pointer.y = event.clientY / Math.max(height, 1) * 2 - 1;
    }, { passive: true });

document.documentElement.addEventListener("pointerleave", () => {
      pointer.x = 0;
      pointer.y = 0;
    });

window.addEventListener("resize", resize, { passive: true });
    document.addEventListener("visibilitychange", synchronizeAnimation);
    motionQuery.addEventListener("change", synchronizeAnimation);

resize();
    synchronizeAnimation();
  });

/* ==========================================
     POINTER-REACTIVE 3D CARDS
     ========================================== */

initialize("3D cards", () => {
    const cards = $$(
      ".photo-frame, .pj-card, .sk-card, .bl-card"
    );

cards.forEach(card => {
      card.classList.add("tilt-ready");

const glare = document.createElement("span");
      glare.className = "tilt-glare";
      glare.setAttribute("aria-hidden", "true");
      card.append(glare);

let bounds = null;
      let frame = 0;
      let pointerX = 0;
      let pointerY = 0;

const maxRotation = card.matches(".photo-frame") ? 9 : 5;

function reset() {
        cancelAnimationFrame(frame);
        frame = 0;
        bounds = null;

card.classList.remove("is-tilting");
        card.style.setProperty("--rx", "0deg");
        card.style.setProperty("--ry", "0deg");
      }

function update() {
        frame = 0;
        if (!bounds) return;

const x = clamp(
          (pointerX - bounds.left) / bounds.width,
          0,
          1
        );

const y = clamp(
          (pointerY - bounds.top) / bounds.height,
          0,
          1
        );

card.style.setProperty(
          "--rx",
          `${((0.5 - y) * maxRotation * 2).toFixed(2)}deg`
        );

card.style.setProperty(
          "--ry",
          `${((x - 0.5) * maxRotation * 2).toFixed(2)}deg`
        );

card.style.setProperty("--mx", `${x * 100}%`);
        card.style.setProperty("--my", `${y * 100}%`);
      }

card.addEventListener("pointerenter", () => {
        if (!pointerQuery.matches || motionQuery.matches) return;

bounds = card.getBoundingClientRect();
        card.classList.add("is-tilting");
      });

card.addEventListener("pointermove", event => {
        if (
          !pointerQuery.matches ||
          motionQuery.matches ||
          event.pointerType === "touch"
        ) return;

if (!bounds) {
          bounds = card.getBoundingClientRect();
          card.classList.add("is-tilting");
        }

pointerX = event.clientX;
        pointerY = event.clientY;

if (!frame) frame = requestAnimationFrame(update);
      }, { passive: true });

card.addEventListener("pointerleave", reset);
      card.addEventListener("pointercancel", reset);

window.addEventListener("scroll", reset, { passive: true });
      window.addEventListener("resize", reset, { passive: true });
      window.addEventListener("blur", reset);

motionQuery.addEventListener("change", reset);
      pointerQuery.addEventListener("change", reset);
    });
  });

/* ==========================================
     CURSOR GLOW
     ========================================== */

initialize("Cursor glow", () => {
    const cursor = $("#cur");
    if (!cursor) return;

cursor.setAttribute("aria-hidden", "true");

let frame = 0;
    let x = -500;
    let y = -500;

document.addEventListener("pointermove", event => {
      if (!pointerQuery.matches || motionQuery.matches) return;

x = event.clientX;
      y = event.clientY;

if (frame) return;

frame = requestAnimationFrame(() => {
        cursor.style.left = `${x}px`;
        cursor.style.top = `${y}px`;
        frame = 0;
      });
    }, { passive: true });

document.documentElement.addEventListener("pointerleave", () => {
      cancelAnimationFrame(frame);
      frame = 0;
      cursor.style.left = "-500px";
      cursor.style.top = "-500px";
    });
  });

/* ==========================================
     NAVIGATION + SCROLL PROGRESS
     ========================================== */

initialize("Navigation", () => {
    const nav = $(".nav");
    const hamburger = $("#hb");
    const drawer = $("#dr");

const progress = document.createElement("div");
    progress.className = "scroll-progress";
    progress.setAttribute("aria-hidden", "true");
    document.body.append(progress);

if (hamburger && drawer) {
      hamburger.setAttribute("aria-controls", drawer.id);
      hamburger.setAttribute("aria-expanded", "false");
      hamburger.setAttribute("aria-label", "Open navigation");

const mobileQuery = window.matchMedia("(max-width: 900px)");

function setMenu(open) {
        drawer.classList.toggle("open", open);
        hamburger.classList.toggle("open", open);
        hamburger.setAttribute("aria-expanded", String(open));
        hamburger.setAttribute(
          "aria-label",
          open ? "Close navigation" : "Open navigation"
        );
      }

hamburger.addEventListener("click", () => {
        setMenu(hamburger.getAttribute("aria-expanded") !== "true");
      });

$$("a", drawer).forEach(link => {
        link.addEventListener("click", () => setMenu(false));
      });

document.addEventListener("keydown", event => {
        if (
          event.key === "Escape" &&
          hamburger.getAttribute("aria-expanded") === "true"
        ) {
          setMenu(false);
          hamburger.focus();
        }
      });

document.addEventListener("click", event => {
        if (
          !drawer.contains(event.target) &&
          !hamburger.contains(event.target)
        ) {
          setMenu(false);
        }
      });

mobileQuery.addEventListener("change", () => setMenu(false));
    }

const links = $$('.nl a[href^="#"], .drawer a[href^="#"]');

const sections = [...new Set(
      links.map(link =>
        document.getElementById(link.getAttribute("href").slice(1))
      ).filter(Boolean)
    )];

let frame = 0;

function update() {
      frame = 0;

const scrollable =
        document.documentElement.scrollHeight - window.innerHeight;

const amount = scrollable > 0
        ? clamp(window.scrollY / scrollable, 0, 1)
        : 0;

progress.style.transform = `scaleX(${amount})`;
      nav?.classList.toggle("is-scrolled", window.scrollY > 20);

const offset = (nav?.offsetHeight || 68) + 100;
      let active = "";

sections.forEach(section => {
        const bounds = section.getBoundingClientRect();

if (bounds.top <= offset && bounds.bottom > offset) {
          active = section.id;
        }
      });

links.forEach(link => {
        const selected = link.getAttribute("href") === `#${active}`;

if (selected) {
          link.setAttribute("aria-current", "location");
        } else {
          link.removeAttribute("aria-current");
        }
      });
    }

function scheduleUpdate() {
      if (!frame) frame = requestAnimationFrame(update);
    }

window.addEventListener("scroll", scheduleUpdate, { passive: true });
    window.addEventListener("resize", scheduleUpdate, { passive: true });
    window.addEventListener("load", scheduleUpdate);

document.addEventListener("portfolio:layout", scheduleUpdate);

if ("ResizeObserver" in window) {
      new ResizeObserver(scheduleUpdate).observe(document.body);
    }

update();
  });

/* ==========================================
     PROJECT FILTERS

Categories are based on the supplied cards.
     Unrecognized future cards remain visible in All.
     ========================================== */

initialize("Project filters", () => {
    const grid = $("#projects .pj-g");
    if (!grid) return;

const cards = $$(".pj-card", grid);

const categories = new Map([
      ["AI Plant Therapist", ["ai"]],
      ["Emotionally Aware Machine", ["ai"]],
      ["StudyBuddy.AI", ["ai", "web"]],
      ["Crisis Connect AI", ["ai", "web"]],
      ["Smart Attendance", ["iot", "web"]],
      ["AI Emergency Hospital Rec.", ["ai", "web"]],
      ["Personal Portfolio", ["web"]]
    ]);

const filterOptions = [
      { value: "all", label: "All projects" },
      { value: "ai", label: "AI / ML" },
      { value: "web", label: "Web apps" },
      { value: "iot", label: "IoT" }
    ];

const controls = document.createElement("div");
    controls.className = "project-filters";
    controls.setAttribute("role", "group");
    controls.setAttribute("aria-label", "Filter projects");

const status = document.createElement("p");
    status.className = "project-status";
    status.setAttribute("role", "status");
    status.setAttribute("aria-live", "polite");
    status.setAttribute("aria-atomic", "true");

function applyFilter(value) {
      let visibleCount = 0;

cards.forEach(card => {
        const title = $(".pj-title", card)?.textContent.trim() || "";
        const cardCategories = categories.get(title) || [];

const visible =
          value === "all" || cardCategories.includes(value);

card.hidden = !visible;

if (visible) {
          visibleCount++;
          card.classList.add("in");
        }
      });

$$("button", controls).forEach(button => {
        button.setAttribute(
          "aria-pressed",
          String(button.dataset.filter === value)
        );
      });

status.textContent =
        `Showing ${visibleCount} of ${cards.length} projects`;

document.dispatchEvent(new Event("portfolio:layout"));
    }

filterOptions.forEach(option => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "filter-btn";
      button.dataset.filter = option.value;
      button.textContent = option.label;

button.setAttribute(
        "aria-pressed",
        String(option.value === "all")
      );

button.addEventListener("click", () => {
        applyFilter(option.value);
      });

controls.append(button);
    });

grid.before(controls);
    grid.after(status);

status.textContent =
      `Showing ${cards.length} of ${cards.length} projects`;
  });

/* ==========================================
     ACCESSIBLE ROLE TICKER
     ========================================== */

initialize("Role ticker", () => {
    const ticker = $("#ticker");
    if (!ticker) return;

const items = $$(".tick-item", ticker);
    if (!items.length) return;

let index = 0;
    let timer = 0;

ticker.setAttribute("role", "img");
    ticker.setAttribute(
      "aria-label",
      items.map(item => item.textContent.trim()).join("; ")
    );

items.forEach(item => item.setAttribute("aria-hidden", "true"));

function showCurrent() {
      items.forEach((item, itemIndex) => {
        item.classList.toggle("active", itemIndex === index);
        item.classList.remove("exit");
      });
    }

function synchronize() {
      window.clearInterval(timer);

if (motionQuery.matches) index = 0;

showCurrent();

if (motionQuery.matches || document.hidden) return;

timer = window.setInterval(() => {
        index = (index + 1) % items.length;
        showCurrent();
      }, 2800);
    }

motionQuery.addEventListener("change", synchronize);
    document.addEventListener("visibilitychange", synchronize);

synchronize();
  });

/* ==========================================
     CONTACT FORM

Opens an email draft; does NOT send email.
     No API keys or backend credentials required.
     ========================================== */

initialize("Contact form", () => {
    const box = $(".form-box");
    if (!box) return;

const nameInput = $('input[type="text"]', box);
    const emailInput = $('input[type="email"]', box);
    const messageInput = $("textarea", box);
    const button = $("#sb", box);

if (!nameInput || !emailInput || !messageInput || !button) return;

const form = document.createElement("form");
    form.className = box.className;

while (box.firstChild) {
      form.append(box.firstChild);
    }

box.replaceWith(form);

const fields = [
      {
        element: nameInput,
        id: "contact-name",
        name: "name",
        autocomplete: "name",
        maxLength: 100
      },
      {
        element: emailInput,
        id: "contact-email",
        name: "email",
        autocomplete: "email",
        maxLength: 254
      },
      {
        element: messageInput,
        id: "contact-message",
        name: "message",
        autocomplete: "off",
        maxLength: 1500
      }
    ];

fields.forEach(field => {
      const input = field.element;

input.id = field.id;
      input.name = field.name;
      input.required = true;
      input.maxLength = field.maxLength;
      input.autocomplete = field.autocomplete;

const label = input.closest(".fg")?.querySelector("label");
      if (label) label.htmlFor = field.id;

input.addEventListener("input", () => {
        input.setCustomValidity("");
      });
    });

const note = document.createElement("p");
    note.id = "contact-note";
    note.className = "form-note";
    note.textContent =
      "Opens a draft in your email app. Review and send it there. " +
      "This website does not send or store your message.";

const status = document.createElement("p");
    status.className = "form-status";
    status.setAttribute("role", "status");
    status.setAttribute("aria-live", "polite");

form.prepend(note);
    form.append(status);
    form.setAttribute("aria-describedby", note.id);

button.removeAttribute("onclick");
    button.onclick = null;
    button.type = "submit";
    button.textContent = "Open Email Draft ↗";

form.addEventListener("submit", event => {
      event.preventDefault();

fields.forEach(({ element }) => {
        element.setCustomValidity(
          element.value.trim() ? "" : "Please complete this field."
        );
      });

if (!form.reportValidity()) return;

const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const message = messageInput.value.trim();

const subject = `Portfolio inquiry from ${name}`;
      const body =
        `Name: ${name}\n` +
        `Reply email: ${email}\n\n` +
        message;

const url =
        "mailto:sugatanayak65@gmail.com" +
        `?subject=${encodeURIComponent(subject)}` +
        `&body=${encodeURIComponent(body)}`;

status.textContent =
        "Opening your email app. Nothing has been sent yet. " +
        "If no draft appears, use the Email link beside this form.";

try {
        window.location.href = url;
      } catch (error) {
        status.textContent =
          "Your email app could not be opened. " +
          "Please use the Email link beside this form.";

console.error("Email draft could not open:", error);
      }
    });
  });

/* ==========================================
     EXTERNAL LINK SAFETY
     ========================================== */

initialize("External links", () => {
    $$('a[target="_blank"]').forEach(link => {
      link.relList.add("noopener", "noreferrer");
    });
  });
})();
</script>
